services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # This container always runs the production image (pino-pretty and other
      # devDependencies are pruned out of it - see Dockerfile), so NODE_ENV must
      # stay "production" here regardless of what .env has for bare-metal `npm run
      # start:dev`. Otherwise the logger tries to load pino-pretty and crashes.
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-project_task_management}
      REDIS_HOST: redis
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"

networks:
  default:
    name: bench-be-network

volumes:
  mongo_data:
  redis_data:
